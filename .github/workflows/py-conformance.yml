name: Python interop conformance

# The pinned-matrix drift tripwire from the interchange spec (section 10):
# the Python shore + cross-engine conformance run against exact pinned
# chainladder versions. A new chainladder release changing numbers is
# caught here by ADDING a matrix column, never by silent breakage.
on:
  push:
    branches: [main]
    paths:
      - "interop/**"
      - "interop/sidecar/**"
      - "schema/interchange/**"
      - "packages/interchange/**"
      - "packages/core/**"
      - "packages/agents/**"
      - "packages/compliance/**"
      - "docs/**"
      - "tools/docs/**"
      - "tools/release/**"
      - "examples/chain-ladder-python/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/py-conformance.yml"
  pull_request:
    branches: [main]

jobs:
  py-base-310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e interop/python pytest
      - run: pytest interop/python/tests/test_jcs.py interop/python/tests/test_documents.py interop/python/tests/test_diagnostics.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Python 3.10-owned documentation snippets
        run: npm run docs:check:py
        env:
          ACTUARIAL_TS_PYTHON: python

  py-conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        chainladder-version: ["0.9.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + pinned engine
        run: |
          python -m pip install --upgrade pip
          pip install -e "interop/python[chainladder]" pytest
          pip install "chainladder==${{ matrix.chainladder-version }}"
      - name: Python shore + cross-engine conformance
        run: pytest interop/python/tests interop/conformance/py -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Python-owned documentation snippets
        run: npm run docs:check:py
        env:
          ACTUARIAL_TS_PYTHON: python

  # The live referee (spec 5 "CI mode" / 13 Phase C): boots the sidecar,
  # proves its own pytest suite, then runs crosscheck:ci — TS engine vs the
  # LIVE chainladder-python service on every committed fixture x both
  # deterministic profiles, failing on any disagree/not-comparable verdict.
  crosscheck-ci:
    runs-on: ubuntu-latest
    env:
      # Intentionally a NON-SECRET constant: the sidecar is an ephemeral
      # localhost process torn down at job end. Do NOT copy this pattern to a
      # real deployment token — the on-failure `cat sidecar.log` step is safe
      # only because the sidecar logs no payloads or auth material.
      SIDECAR_TOKEN: ci-crosscheck-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install interchange package + sidecar requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e "interop/python[chainladder]" pytest
          pip install -r interop/sidecar/requirements-dev.txt
      - name: Sidecar test suite
        run: PYTHONPATH=interop pytest interop/sidecar/tests tools/release/test-check-sidecar-engine.py -q
      - name: Boot the sidecar
        run: |
          SIDECAR_PORT="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          echo "SIDECAR_PORT=$SIDECAR_PORT" >> "$GITHUB_ENV"
          echo "SIDECAR_URL=http://127.0.0.1:$SIDECAR_PORT" >> "$GITHUB_ENV"
          PYTHONPATH=interop SIDECAR_PORT="$SIDECAR_PORT" SIDECAR_TOKEN="$SIDECAR_TOKEN" nohup python -m sidecar > sidecar.log 2>&1 &
          echo $! > sidecar.pid
      - name: Wait for authenticated /v1/engine identity
        run: |
          for i in $(seq 1 60); do
            if engine="$(curl -sf --connect-timeout 1 --max-time 2 -H "Authorization: Bearer $SIDECAR_TOKEN" "$SIDECAR_URL/v1/engine")" && \
               printf '%s' "$engine" | PYTHONPATH=interop python tools/release/check-sidecar-engine.py; then exit 0; fi
            sleep 1
          done
          echo "sidecar never returned the authenticated engine identity" >&2
          cat sidecar.log >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install TS workspaces (builds the packages via prepare)
        run: npm ci
      - name: Cross-engine referee (crosscheck:ci)
        run: npm run crosscheck:ci
      - name: Chain-ladder Python example (live sidecar)
        run: npm test -w @actuarial-ts/example-chain-ladder-python
      - name: Sidecar log on failure
        if: failure()
        run: cat sidecar.log || true
      - name: Stop the sidecar
        if: always()
        run: kill "$(cat sidecar.pid)" 2>/dev/null || true
