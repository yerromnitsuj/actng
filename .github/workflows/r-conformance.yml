name: R interop conformance

# The third shore. The TS runner is in `CI`, the Python runner in
# `py-conformance.yml`; without this job the README's "three shores" claim
# rested on manual runs. ChainLadder + jsonlite come from CRAN with a cache,
# since compiling ChainLadder's dependency tree cold takes several minutes.
on:
  push:
    branches: [main]
    paths:
      - "tools/interop/**"
      - "interop/**"
      - "schema/interchange/**"
      - ".github/workflows/r-conformance.yml"
      - "examples/chain-ladder-r/**"
      - "examples/chain-ladder-crosscheck/**"
      - "packages/**"
      - "package-lock.json"
      - "docs/**"
      - "tools/docs/**"
      - "tools/release/**"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "tools/interop/**"
      - "interop/**"
      - "schema/interchange/**"
      - ".github/workflows/r-conformance.yml"
      - "examples/chain-ladder-r/**"
      - "examples/chain-ladder-crosscheck/**"
      - "packages/**"
      - "package-lock.json"
      - "docs/**"
      - "tools/docs/**"
      - "tools/release/**"
      - "package.json"

jobs:
  r-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true # binary packages; cold install in seconds, not minutes
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.R-interop-lib
          key: r-4.4.3-chainladder-0.2.21-jsonlite-2.0.0-${{ runner.os }}
      - name: Resolve the exact R executable
        run: echo "ACTUARIAL_TS_RSCRIPT=$(command -v Rscript)" >> "$GITHUB_ENV"
      - name: Install exact R environment contract
        run: |
          "$ACTUARIAL_TS_RSCRIPT" tools/interop/install-r-environment.R
      - name: Verify exact R environment contract
        run: |
          "$ACTUARIAL_TS_RSCRIPT" tools/interop/test-r-environment.R
          "$ACTUARIAL_TS_RSCRIPT" tools/interop/check-r-environment.R
      - name: JCS serializer self-test (committed vectors)
        run: |
          "$ACTUARIAL_TS_RSCRIPT" -e 'source("tools/interop/actuarialInterchange.R"); r <- ats_test_jcs(); stopifnot(r$failed == 0L)'
      - name: JCS serializer under a hostile collator (da_DK 'aa' contraction)
        # icuSetCollate needs no OS locale generation; if this R build lacks ICU
        # it warns and the step degenerates to a byte-order re-run (still valid).
        run: |
          "$ACTUARIAL_TS_RSCRIPT" -e 'icuSetCollate(locale = "da_DK");
            if (capabilities("ICU") && order(c("00ab","00aa"))[1] != 1L)
              message("NOTICE: collator not hostile; locale leg is not exercising the trap");
            source("tools/interop/actuarialInterchange.R");
            r <- ats_test_jcs(); stopifnot(r$failed == 0L)'
      - name: Embedded document version guard (spec 3.5)
        run: |
          "$ACTUARIAL_TS_RSCRIPT" tools/interop/test-read-document.R
      - name: Cross-engine conformance (frozen corpus, mack1993-vw profile)
        run: |
          "$ACTUARIAL_TS_RSCRIPT" tools/interop/conformance.R
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: npm ci (workspace + SDK build via prepare)
        run: npm ci
      - name: R-owned documentation snippets
        run: npm run docs:check:r
        env:
          ACTUARIAL_TS_RSCRIPT: ${{ env.ACTUARIAL_TS_RSCRIPT }}
      - name: run-mack.R CLI smoke (literature anchor)
        run: |
          "$ACTUARIAL_TS_RSCRIPT" tools/interop/run-mack.R \
            --in interop/conformance/fixtures/taylor-ashe/triangle.json \
            --selection interop/conformance/fixtures/taylor-ashe/selection.json \
            --out /tmp/r-result.json --created-at 2026-07-19T00:00:00Z
          "$ACTUARIAL_TS_RSCRIPT" -e 'source("tools/interop/actuarialInterchange.R");
            doc <- ats_read_document("/tmp/r-result.json");
            stopifnot(abs(doc$result$totals$unpaid - 18680856) <= 1)'
      - name: run-mack.R selection honesty (injection + not-comparable)
        run: |
          "$ACTUARIAL_TS_RSCRIPT" tools/interop/test-run-mack-selection.R
      - name: Chain-ladder R example (live Rscript)
        run: npm test -w @actuarial-ts/example-chain-ladder-r

  # The capstone (Task 6): boots BOTH the sidecar and Rscript, then computes
  # the Taylor & Ashe result with all three engines live and referees them
  # pairwise. Sidecar-boot block mirrors py-conformance.yml's crosscheck-ci
  # job (pip upgrade first, fail-loud health poll) rather than drifting.
  examples-capstone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.R-interop-lib
          key: r-4.4.3-chainladder-0.2.21-jsonlite-2.0.0-${{ runner.os }}
      - name: Resolve and install exact R environment contract
        run: |
          echo "ACTUARIAL_TS_RSCRIPT=$(command -v Rscript)" >> "$GITHUB_ENV"
          Rscript tools/interop/install-r-environment.R
          Rscript tools/interop/check-r-environment.R
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision + boot the sidecar
        run: |
          python3 -m venv .venv-interop
          .venv-interop/bin/python -m pip install --upgrade pip
          .venv-interop/bin/pip install -e interop/python -r interop/sidecar/requirements.txt
          SIDECAR_PORT="$(.venv-interop/bin/python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          SIDECAR_TOKEN=ci-secret
          echo "SIDECAR_PORT=$SIDECAR_PORT" >> "$GITHUB_ENV"
          echo "SIDECAR_URL=http://127.0.0.1:$SIDECAR_PORT" >> "$GITHUB_ENV"
          echo "SIDECAR_TOKEN=$SIDECAR_TOKEN" >> "$GITHUB_ENV"
          PYTHONPATH=interop SIDECAR_PORT="$SIDECAR_PORT" SIDECAR_TOKEN="$SIDECAR_TOKEN" nohup .venv-interop/bin/python -m sidecar > sidecar.log 2>&1 &
          echo $! > sidecar.pid
      - name: Wait for authenticated /v1/engine identity
        run: |
          for i in $(seq 1 60); do
            if engine="$(curl -sf --connect-timeout 1 --max-time 2 -H "Authorization: Bearer $SIDECAR_TOKEN" "$SIDECAR_URL/v1/engine")" && \
               printf '%s' "$engine" | PYTHONPATH=interop .venv-interop/bin/python tools/release/check-sidecar-engine.py; then exit 0; fi
            sleep 1
          done
          echo "sidecar never returned the authenticated engine identity" >&2
          cat sidecar.log >&2
          exit 1
      - name: Capstone — three engines, one referee
        run: npm test -w @actuarial-ts/example-chain-ladder-crosscheck
      - name: Sidecar log on failure
        if: failure()
        run: cat sidecar.log || true
      - name: Teardown
        if: always()
        run: kill "$(cat sidecar.pid)" 2>/dev/null || true
